services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4566/_floci/health || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 5

  floci-bootstrap:
    image: amazon/aws-cli:latest
    container_name: floci-bootstrap
    environment:
      - AWS_ACCESS_KEY_ID=mock-key
      - AWS_SECRET_ACCESS_KEY=mock-secret
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://floci:4566
    depends_on:
      floci:
        condition: service_healthy
    command: >
      dynamodb create-table
        --table-name people-table-local
        --attribute-definitions AttributeName=uuid,AttributeType=S AttributeName=swapiPersonId,AttributeType=S
        --key-schema AttributeName=uuid,KeyType=HASH
        --global-secondary-indexes '[{"IndexName":"swapiId-index-local","KeySchema":[{"AttributeName":"swapiPersonId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]'
        --billing-mode PAY_PER_REQUEST
